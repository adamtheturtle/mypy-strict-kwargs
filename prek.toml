# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

fail_fast = true
default_install_hook_types = [
  "pre-commit",
  "pre-push"
  ]

[[repos]]
repo = "meta"
hooks = [
  { id = "check-useless-excludes" }
]

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [
  { id = "check-added-large-files" },
  { id = "check-case-conflict" },
  { id = "check-executables-have-shebangs" },
  { id = "check-merge-conflict" },
  { id = "check-shebang-scripts-are-executable" },
  { id = "check-symlinks" },
  { id = "check-json" },
  { id = "check-toml" },
  { id = "check-vcs-permalinks" },
  { id = "check-yaml" },
  { id = "end-of-file-fixer" },
  {
    id = "file-contents-sorter",
    files = 'spelling_private_dict\.txt$'
  },
  { id = "trailing-whitespace" }
]

[[repos]]
repo = "https://github.com/pre-commit/pygrep-hooks"
rev = "v1.10.0"
hooks = [
  { id = "rst-directive-colons" },
  { id = "rst-inline-touching-normal" },
  { id = "text-unicode-replacement-char" },
  { id = "rst-backticks" }
]

[[repos]]
repo = "local"
hooks = [
  {
    id = "actionlint",
    name = "actionlint",
    entry = "uv run --extra=dev actionlint",
    language = "python",
    pass_filenames = false,
    types_or = ["yaml"],
    additional_dependencies = ["uv==0.11.7"]
  },
  {
    id = "pydocstringformatter",
    name = "pydocstringformatter",
    entry = "uv run --extra=dev pydocstringformatter",
    language = "python",
    types_or = ["python"],
    additional_dependencies = ["uv==0.11.7"]
  },
  {
    id = "shellcheck",
    name = "shellcheck",
    entry = "uv run --extra=dev shellcheck --shell=bash",
    language = "python",
    types_or = ["shell"],
    additional_dependencies = ["uv==0.11.7"]
  },
  {
    id = "shellcheck-docs",
    name = "shellcheck-docs",
    entry = 'uv run --extra=dev doccmd --no-write-to-file --example-workers 0 --language=shell --language=console --command="shellcheck --shell=bash"',
    language = "python",
    types_or = [
      "markdown",
      "rst"
    ],
    additional_dependencies = ["uv==0.11.7"]
  },
  {
    id = "shfmt",
    name = "shfmt",
    entry = "uv run --extra=dev shfmt --write --space-redirects --indent=4",
    language = "python",
    types_or = ["shell"],
    additional_dependencies = ["uv==0.11.7"]
  },
  {
    id = "shfmt-docs",
    name = "shfmt-docs",
    entry = 'uv run --extra=dev doccmd --language=shell --language=console --skip-marker=shfmt --no-pad-file --command="shfmt --write --space-redirects --indent=4"',
    language = "python",
    types_or = [
      "markdown",
      "rst"
    ],
    additional_dependencies = ["uv==0.11.7"]
  },
  {
    id = "mypy",
    name = "mypy",
    stages = ["pre-push"],
    entry = "uv run --extra=dev -m mypy --num-workers=4",
    language = "python",
    types_or = [
      "python",
      "toml"
    ],
    pass_filenames = false,
    additional_dependencies = ["uv==0.11.7"]
  },
  {
    id = "mypy-docs",
    name = "mypy-docs",
    stages = ["pre-push"],
    entry = 'uv run --extra=dev doccmd --no-write-to-file --language=python --command="mypy --num-workers=4"',
    language = "python",
    types_or = [
      "markdown",
      "rst"
    ],
    additional_dependencies = ["uv==0.11.7"]
  },
  {
    id = "check-manifest",
    name = "check-manifest",
    stages = ["pre-push"],
    entry = "uv run --extra=dev -m check_manifest",
    language = "python",
    pass_filenames = false,
    additional_dependencies = ["uv==0.11.7"]
  },
  {
    id = "pyright",
    name = "pyright",
    stages = ["pre-push"],
    entry = "uv run --extra=dev -m pyright .",
    language = "python",
    types_or = [
      "python",
      "toml"
    ],
    pass_filenames = false,
    additional_dependencies = ["uv==0.11.7"]
  },
  {
    id = "pyright-docs",
    name = "pyright-docs",
    stages = ["pre-push"],
    entry = 'uv run --extra=dev doccmd --no-write-to-file --example-workers 0 --language=python --command="pyright"',
    language = "python",
    types_or = [
      "markdown",
      "rst"
    ],
    additional_dependencies = ["uv==0.11.7"]
  },
  {
    id = "pyright-verifytypes",
    name = "pyright-verifytypes",
    stages = ["pre-push"],
    entry = "uv run --extra=dev -m pyright --ignoreexternal --verifytypes mypy_strict_kwargs",
    language = "python",
    pass_filenames = false,
    types_or = ["python"],
    additional_dependencies = ["uv==0.11.7"]
  },
  {
    id = "ty",
    name = "ty",
    stages = ["pre-push"],
    entry = "uv run --extra=dev ty check",
    language = "python",
    types_or = [
      "python",
      "toml"
    ],
    pass_filenames = false,
    additional_dependencies = ["uv==0.11.7"]
  },
  {
    id = "ty-docs",
    name = "ty-docs",
    stages = ["pre-push"],
    entry = 'uv run --extra=dev doccmd --no-write-to-file --example-workers 0 --language=python --command="ty check"',
    language = "python",
    types_or = [
      "markdown",
      "rst"
    ],
    additional_dependencies = ["uv==0.11.7"]
  },
  {
    id = "pyrefly",
    name = "pyrefly",
    stages = ["pre-push"],
    entry = "uv run --extra=dev pyrefly check",
    language = "python",
    types_or = [
      "python",
      "toml"
    ],
    pass_filenames = false,
    additional_dependencies = ["uv==0.11.7"]
  },
  {
    id = "pyrefly-docs",
    name = "pyrefly-docs",
    stages = ["pre-push"],
    entry = 'uv run --extra=dev doccmd --no-write-to-file --example-workers 0 --language=python --command="pyrefly check"',
    language = "python",
    types_or = [
      "markdown",
      "rst"
    ],
    additional_dependencies = ["uv==0.11.7"]
  },
  {
    id = "vulture",
    name = "vulture",
    entry = "uv run --extra=dev -m vulture .",
    language = "python",
    types_or = ["python"],
    pass_filenames = false,
    additional_dependencies = ["uv==0.11.7"]
  },
  {
    id = "vulture-docs",
    name = "vulture docs",
    entry = 'uv run --extra=dev doccmd --no-write-to-file --example-workers 0 --language=python --command="vulture"',
    language = "python",
    types_or = [
      "markdown",
      "rst"
    ],
    additional_dependencies = ["uv==0.11.7"]
  },
  {
    id = "pyroma",
    name = "pyroma",
    entry = "uv run --extra=dev -m pyroma --min 10 .",
    language = "python",
    pass_filenames = false,
    types_or = ["toml"],
    additional_dependencies = ["uv==0.11.7"]
  },
  {
    id = "deptry",
    name = "deptry",
    entry = "uv run --extra=dev -m deptry src/",
    language = "python",
    pass_filenames = false,
    types_or = ["toml"],
    additional_dependencies = ["uv==0.11.7"]
  },
  {
    id = "pylint",
    name = "pylint",
    entry = "uv run --extra=dev -m pylint src/ tests/",
    language = "python",
    stages = ["manual"],
    pass_filenames = false,
    additional_dependencies = ["uv==0.11.7"]
  },
  {
    id = "pylint-docs",
    name = "pylint-docs",
    entry = 'uv run --extra=dev doccmd --no-write-to-file --example-workers 0 --language=python --command="pylint"',
    language = "python",
    stages = ["manual"],
    types_or = [
      "markdown",
      "rst"
    ],
    additional_dependencies = ["uv==0.11.7"]
  },
  {
    id = "ruff-check-fix",
    name = "Ruff check fix",
    entry = "uv run --extra=dev -m ruff check --fix",
    language = "python",
    types_or = ["python"],
    additional_dependencies = ["uv==0.11.7"]
  },
  {
    id = "ruff-check-fix-docs",
    name = "Ruff check fix docs",
    entry = 'uv run --extra=dev doccmd --language=python --command="ruff check --fix"',
    language = "python",
    types_or = [
      "markdown",
      "rst"
    ],
    additional_dependencies = ["uv==0.11.7"]
  },
  {
    id = "ruff-format-fix",
    name = "Ruff format",
    entry = "uv run --extra=dev -m ruff format",
    language = "python",
    types_or = ["python"],
    additional_dependencies = ["uv==0.11.7"]
  },
  {
    id = "ruff-format-fix-docs",
    name = "Ruff format docs",
    entry = 'uv run --extra=dev doccmd --language=python --no-pad-file --command="ruff format"',
    language = "python",
    types_or = [
      "markdown",
      "rst"
    ],
    additional_dependencies = ["uv==0.11.7"]
  },
  {
    id = "strict-kwargs-fix",
    name = "strict-kwargs",
    entry = "uv run --extra=dev strict-kwargs check --diff",
    language = "python",
    types_or = ["python"],
    additional_dependencies = ["uv==0.11.7"],
    require_serial = true
  },
  {
    id = "no-defaults",
    name = "no-defaults",
    entry = "uv run --extra=dev no-defaults",
    language = "python",
    types_or = ["python"],
    additional_dependencies = ["uv==0.11.7"],
    require_serial = true
  },
  {
    id = "vale-sync",
    name = "vale sync",
    entry = "uv run --extra=dev vale sync",
    language = "python",
    pass_filenames = false,
    files = '(\.(rst|md)$|^\.vale\.ini$)',
    additional_dependencies = ["uv==0.11.7"]
  },
  {
    id = "vale",
    name = "vale",
    entry = "uv run --extra=dev vale",
    language = "python",
    types_or = [
      "rst",
      "markdown"
    ],
    require_serial = true,
    additional_dependencies = ["uv==0.11.7"]
  },
  {
    id = "doc8",
    name = "doc8",
    entry = "uv run --extra=dev -m doc8",
    language = "python",
    types_or = ["rst"],
    additional_dependencies = ["uv==0.11.7"]
  },
  {
    id = "interrogate",
    name = "interrogate",
    entry = "uv run --extra=dev -m interrogate",
    language = "python",
    types_or = ["python"],
    additional_dependencies = ["uv==0.11.7"]
  },
  {
    id = "interrogate-docs",
    name = "interrogate docs",
    entry = 'uv run --extra=dev doccmd --no-write-to-file --example-workers 0 --language=python --command="interrogate"',
    language = "python",
    types_or = [
      "markdown",
      "rst"
    ],
    additional_dependencies = ["uv==0.11.7"]
  },
  {
    id = "pyproject-fmt-fix",
    name = "pyproject-fmt",
    entry = "uv run --extra=dev pyproject-fmt",
    language = "python",
    types_or = ["toml"],
    files = "pyproject.toml",
    additional_dependencies = ["uv==0.11.7"]
  },
  {
    id = "yamlfix",
    name = "yamlfix",
    entry = "uv run --extra=dev yamlfix",
    language = "python",
    types_or = ["yaml"],
    exclude = '^tests/test_plugin\.yaml$',
    additional_dependencies = ["uv==0.11.7"]
  },
  {
    id = "zizmor",
    name = "zizmor",
    entry = "uv run --extra=dev zizmor --strict-collection .github",
    language = "python",
    pass_filenames = false,
    types_or = ["yaml"],
    additional_dependencies = ["uv==0.11.7"]
  },
  {
    id = "sphinx-lint",
    name = "sphinx-lint",
    entry = "uv run --extra=dev sphinx-lint --enable=all --disable=line-too-long",
    language = "python",
    types_or = ["rst"],
    additional_dependencies = ["uv==0.11.7"]
  }
]
