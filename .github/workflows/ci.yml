---
name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # * is a special character in YAML so you have to quote this string
    # Run at 1:00 every day
    - cron: 0 1 * * *

permissions: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
        platform: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7

        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: '**/pyproject.toml'

      - name: Run tests
        run: |
          # We run tests against "." and not the tests directory as we test the README
          # and documentation.
          uv run --group=dev coverage run -m pytest -s -vvv .
        env:
          UV_PYTHON: ${{ matrix.python-version }}

      - name: Upload coverage data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.platform }}-${{ matrix.python-version }}
          path: .coverage.*
          include-hidden-files: true
          if-no-files-found: error

  # Python 3.11-3.13 cannot parse template strings, so only the Python 3.14
  # jobs can cover their AST traversal. Combine every job before checking 100%.
  coverage:
    name: Combine and check coverage
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: '**/pyproject.toml'
          python-version: '3.14'
      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          merge-multiple: true
      - name: Require 100% coverage
        run: |
          uv run --group=dev coverage combine
          uv run --group=dev coverage report

  completion-ci:
    needs: [build, coverage]
    runs-on: ubuntu-latest
    if: always()  # Run even if one matrix job fails
    steps:
      - name: Check matrix job status
        run: |-
          if ! ${{ needs.build.result == 'success' }}; then
            echo "One or more matrix jobs failed"
            exit 1
          fi
          if ! ${{ needs.coverage.result == 'success' }}; then
            echo "Coverage check failed"
            exit 1
          fi
