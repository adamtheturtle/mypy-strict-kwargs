# Overloaded callables are not signature-transformed (mypy matches
# variants against each item), so positional misuse is reported from the
# function/method hook instead of as a generic call-overload error.
- case: overloaded_call_reports_call_arg
  mypy_config: |
    [mypy]
    plugins = mypy_strict_kwargs
  main: |-
    from typing import overload


    @overload
    def f(x: int) -> int: ...


    @overload
    def f(x: str) -> str: ...


    def f(x: int | str) -> int | str:
        return x


    class C:
        @overload
        def method(self, x: int) -> int: ...

        @overload
        def method(self, x: str) -> str: ...

        def method(self, x: int | str) -> int | str:
            return x


    def use(c: C) -> None:
        str(1)
        f(1)
        c.method(1)
        str(object=1)
        f(x=1)
        c.method(x=1)
